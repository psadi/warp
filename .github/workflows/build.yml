name: CI/Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: v2026.4.11
          cache: true
          install: false

      - run: mise install
      - run: go mod verify

      - run: |
          go mod tidy
          git diff --exit-code

      - run: mise run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v4
        with:
          version: v2026.4.11
          cache: true
          install: false

      - run: mise install
      - run: mise run test

  build:
    needs: [lint, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            arch: amd64
          - os: macos-latest
            os_name: darwin
            arch: arm64
          - os: windows-latest
            os_name: windows
            arch: amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=$(git describe --tags --always --dirty | sed 's/^v//')" >> $GITHUB_OUTPUT

      - uses: jdx/mise-action@v4
        with:
          version: v2026.4.11
          cache: true
          install: false

      - run: mise install

      - name: Build
        id: build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GOOS: ${{ matrix.os_name }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mise run build
          mv dist/warp${{ matrix.ext || '' }} \
             "dist/warp-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.ext || '' }}"
          echo "artifact_name=warp-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch }}${{ matrix.ext || '' }}" >> $GITHUB_OUTPUT

      - name: Upload artifact (PR/push)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: dist/${{ steps.build.outputs.artifact_name }}

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.build.outputs.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
      - run: cyclonedx-gomod mod -json -output sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: go

      - uses: jdx/mise-action@v4
        with:
          version: v2026.4.11
          install: false

      - run: mise install
      - run: mise run build

      - uses: github/codeql-action/analyze@v3
